<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>netwatch</title>
<style>
    body {
        max-width: 26rem;
        margin: 3rem auto;
        padding: 0 1.5rem;
        font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #1a1f24;
    }

    h1 { font-size: 1.2rem; margin: 0 0 0.2rem; }
    p { color: #6b7178; font-size: 0.9rem; margin: 0.4rem 0 1.4rem; }

    input { font: inherit; padding: 0.3rem 0.5rem; width: 7rem; }
    button { font: inherit; padding: 0.3rem 0.9rem; margin-left: 0.5rem; }

    .said { color: #6b7178; font-size: 0.85rem; margin-top: 1rem; }

    h2 { font-size: 1rem; margin: 2.5rem 0 0.2rem; }

    .site { display: flex; align-items: baseline; justify-content: space-between;
            gap: 1rem; padding: 0.4rem 0; }
    .site b { font-weight: 600; }
    .site span { color: #6b7178; font-size: 0.85rem; }
</style>
</head>
<body>
    <h1>netwatch</h1>
    <p>The port netwatch listens on. Change it here if you started it with
    <code>-port</code>.</p>

    <input id="port" type="number" min="1" max="65535">
    <button id="save">Save</button>

    <p class="said" id="said"></p>

    <h2>Sites you added</h2>
    <p>netwatch knows them; the browser does not. It has to be asked for each
    one, and only you can ask it.</p>

    <div id="sites"></div>
    <script src="dist/options.js"></script>
</body>
</html>
