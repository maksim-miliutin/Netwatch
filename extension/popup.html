<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
    body {
        width: 250px;
        margin: 0;
        padding: 14px;
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #1a1f24;
    }

    p { margin: 0; }

    .what { font-weight: 600; }
    .who, .quiet { color: #6b7178; }
    .said { color: #6b7178; font-size: 11px; margin-top: 10px;
            border-top: 1px solid #e4e2dd; padding-top: 8px; }

    .bar { height: 3px; background: #e4e2dd; margin: 10px 0 4px; }
    .bar i { display: block; height: 100%; width: 0; background: #1a1f24; }

    .times { display: flex; justify-content: space-between; color: #6b7178; font-size: 11px; }

    a { color: #6b7178; display: inline-block; margin-top: 12px; font-size: 12px; }

    .stop { margin: 12px 0 0; }
    .stop button { font: inherit; font-size: 12px; padding: 0.25rem 0.7rem; }

    .asleep #state { opacity: 0.45; }
</style>
</head>
<body>
    <div id="state"></div>
    <p class="stop"><button id="pause">Pause recording</button></p>
    <a id="list" href="http://127.0.0.1:7373" target="_blank">Open the list</a>
    <script src="dist/popup.js"></script>
</body>
</html>
